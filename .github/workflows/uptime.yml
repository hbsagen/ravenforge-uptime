name: Ravenforge public availability
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Simulate an outage to test the GitHub alert'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-availability
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check HTTPS and certificate
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          MONITOR_TOKEN: ${{ secrets.RAVENFORGE_MONITOR_TOKEN }}
        shell: python
        run: |
          import datetime, json, os, socket, ssl, urllib.request
          problems = []
          try:
              request = urllib.request.Request(
                  'https://ravenforge-uptime-probe.hbsagen.workers.dev/health',
                  headers={'User-Agent': 'RavenforgeUptime/1.0',
                           'X-Ravenforge-Monitor': os.environ['MONITOR_TOKEN']})
              with urllib.request.urlopen(request, timeout=40) as response:
                  data = json.loads(response.read(16385))
              checked = datetime.datetime.fromisoformat(data['checkedAt'].replace('Z', '+00:00'))
              age = (datetime.datetime.now(datetime.timezone.utc)-checked).total_seconds()
              expected = {'/', '/personvern/', '/avtalevilkar/'}
              checks = data['checks']
              if not (-60 <= age <= 120 and data['healthy'] is True and len(checks) == 3
                      and {c['path'] for c in checks} == expected
                      and all(c['status'] == 200 and c['okay'] is True for c in checks)):
                  problems.append('Public website probe is unhealthy or stale')
          except Exception:
              problems.append('Public website probe unavailable or invalid')
          with socket.create_connection(('ravenforge.no', 443), timeout=10) as sock:
              with ssl.create_default_context().wrap_socket(sock, server_hostname='ravenforge.no') as tls:
                  expiry = ssl.cert_time_to_seconds(tls.getpeercert()['notAfter'])
          remaining = (expiry-datetime.datetime.now(datetime.timezone.utc).timestamp())/86400
          print('Certificate days remaining:', round(remaining, 1))
          if remaining <= 30:
              problems.append('Certificate expires within 30 days')
          if os.environ.get('SIMULATE_FAILURE') == 'true':
              problems.append('TEST ONLY: simulated outage; no production interruption')
          for problem in problems:
              print('::error::' + problem)
          raise SystemExit(bool(problems))
